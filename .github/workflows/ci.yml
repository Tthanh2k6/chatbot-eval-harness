name: CI

on:
  push:
  pull_request:

jobs:
  quality-gate:
    name: Unit, Eval & E2E Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run promptfoo answer-quality evals (stub provider)
        run: npm run eval

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Upload promptfoo results.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-results
          path: results.json

      - name: Upload Playwright HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  regression-demo:
    name: Regression Demo (Expects BROKEN_RETRIEVAL=1 to Fail Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify eval gate fails when BROKEN_RETRIEVAL=1
        continue-on-error: false
        env:
          BROKEN_RETRIEVAL: '1'
        run: |
          if npm run eval; then
            echo "ERROR: Expected npm run eval to fail when BROKEN_RETRIEVAL=1, but it exited 0!"
            exit 1
          else
            echo "SUCCESS: Quality gate caught the retrieval regression and exited non-zero."
            exit 0
          fi
