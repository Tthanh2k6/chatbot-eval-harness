# 40 evaluation test cases for Quillnote chatbot:
# - 25 factual (icontains fact + icontains citation file)
# - 8 out-of-scope (icontains refusal text)
# - 5 prompt-injection attempts (not-icontains system prompt markers, still answers or refuses)
# - 2 ambiguous (answers from Quillnote docs with citation)

# === 25 Factual Tests ===
- description: "Factual 01: Plus plan monthly price"
  vars:
    question: "How much does the Quillnote Plus plan cost per month and per year?"
  assert:
    - type: icontains
      value: "$8 per month"
    - type: icontains
      value: "docs/pricing-plans.md"

- description: "Factual 02: Team plan price and minimum seat requirement"
  vars:
    question: "What is the price per user and minimum seat requirement for the Team plan?"
  assert:
    - type: icontains
      value: "$15 per user per month"
    - type: icontains
      value: "docs/pricing-plans.md"

- description: "Factual 03: Student and educator discount on annual Plus plan"
  vars:
    question: "What student discount does Quillnote offer on the annual Plus plan?"
  assert:
    - type: icontains
      value: "50% discount"
    - type: icontains
      value: "docs/pricing-plans.md"

- description: "Factual 04: Offline local cache limit on desktop and mobile"
  vars:
    question: "How many notes are cached locally for offline editing on desktop and mobile apps?"
  assert:
    - type: icontains
      value: "5,000 notes"
    - type: icontains
      value: "docs/offline-sync.md"

- description: "Factual 05: Reconnection delta sync delay after working offline"
  vars:
    question: "How quickly does Quillnote sync pending offline changes after reconnecting to the internet?"
  assert:
    - type: icontains
      value: "5 seconds"
    - type: icontains
      value: "docs/offline-sync.md"

- description: "Factual 06: Offline sync conflict resolution notebook"
  vars:
    question: "How does Quillnote resolve offline sync conflicts when a note is edited on two devices?"
  assert:
    - type: icontains
      value: "Sync Conflicts"
    - type: icontains
      value: "docs/offline-sync.md"

- description: "Factual 07: Collaborator limit per note on the Plus plan"
  vars:
    question: "How many collaborators per note are allowed on the Free plan versus the Plus plan?"
  assert:
    - type: icontains
      value: "25 collaborators"
    - type: icontains
      value: "docs/sharing.md"

- description: "Factual 08: Session termination time after revoking a share link"
  vars:
    question: "How quickly are active sessions terminated when a note owner revokes a share link?"
  assert:
    - type: icontains
      value: "60 seconds"
    - type: icontains
      value: "docs/sharing.md"

- description: "Factual 09: Supported export file formats including Quillnote Archive"
  vars:
    question: "What five export file formats does Quillnote support for exporting notes?"
  assert:
    - type: icontains
      value: ".qna"
    - type: icontains
      value: "docs/export-formats.md"

- description: "Factual 10: Subscription plans that support PDF export"
  vars:
    question: "Which subscription plans support exporting notes to PDF format?"
  assert:
    - type: icontains
      value: "Plus and Team"
    - type: icontains
      value: "docs/export-formats.md"

- description: "Factual 11: Daily limit on full account bulk exports"
  vars:
    question: "How many times per 24-hour period can a user run a full account bulk export?"
  assert:
    - type: icontains
      value: "3 times"
    - type: icontains
      value: "docs/export-formats.md"

- description: "Factual 12: Keyboard shortcut to open the Quick Switcher"
  vars:
    question: "What keyboard shortcut opens the Quick Switcher to jump to any note by title?"
  assert:
    - type: icontains
      value: "Ctrl+K"
    - type: icontains
      value: "docs/keyboard-shortcuts.md"

- description: "Factual 13: Keyboard shortcut to toggle Zen Focus Mode"
  vars:
    question: "What keyboard shortcut toggles Zen Focus Mode for distraction-free writing?"
  assert:
    - type: icontains
      value: "Ctrl+Shift+Z"
    - type: icontains
      value: "docs/keyboard-shortcuts.md"

- description: "Factual 14: Confirmation phrase required for account deletion"
  vars:
    question: "What confirmation phrase must I type to permanently delete my Quillnote account?"
  assert:
    - type: icontains
      value: "DELETE MY NOTES"
    - type: icontains
      value: "docs/account-deletion.md"

- description: "Factual 15: Deactivation grace period after requesting account deletion"
  vars:
    question: "How long is the deactivation grace period after requesting account deletion?"
  assert:
    - type: icontains
      value: "14-day"
    - type: icontains
      value: "docs/account-deletion.md"

- description: "Factual 16: Trash folder retention period on the Free plan"
  vars:
    question: "How many days are deleted notes retained in the Trash folder on the Free plan?"
  assert:
    - type: icontains
      value: "30 days"
    - type: icontains
      value: "docs/data-retention.md"

- description: "Factual 17: Automatic version history snapshot interval"
  vars:
    question: "How often does Quillnote save automatic version history snapshots while editing a note?"
  assert:
    - type: icontains
      value: "10 minutes"
    - type: icontains
      value: "docs/data-retention.md"

- description: "Factual 18: Encryption standard used for production database backups at rest"
  vars:
    question: "What encryption standard does Quillnote use for production database backups at rest?"
  assert:
    - type: icontains
      value: "AES-256"
    - type: icontains
      value: "docs/data-retention.md"

- description: "Factual 19: REST API rate limit per minute on the Free plan"
  vars:
    question: "What is the REST API rate limit in requests per minute for Free plan tokens?"
  assert:
    - type: icontains
      value: "60 requests per minute"
    - type: icontains
      value: "docs/api-rate-limits.md"

- description: "Factual 20: Maximum JSON payload size for API requests"
  vars:
    question: "What is the maximum JSON payload size and concurrent connection cap for API requests?"
  assert:
    - type: icontains
      value: "5 MB"
    - type: icontains
      value: "docs/api-rate-limits.md"

- description: "Factual 21: HTTP status code returned when exceeding API rate limit"
  vars:
    question: "What HTTP status code does the Quillnote API return when a client exceeds the rate limit?"
  assert:
    - type: icontains
      value: "429"
    - type: icontains
      value: "docs/api-rate-limits.md"

- description: "Factual 22: Supported two-factor authentication methods and SMS policy"
  vars:
    question: "Does Quillnote support TOTP authenticator apps or SMS two-factor authentication?"
  assert:
    - type: icontains
      value: "TOTP"
    - type: icontains
      value: "docs/two-factor-auth.md"

- description: "Factual 23: Number of single-use recovery codes generated for 2FA"
  vars:
    question: "How many single-use recovery codes does Quillnote generate when you activate 2FA?"
  assert:
    - type: icontains
      value: "10 single-use"
    - type: icontains
      value: "docs/two-factor-auth.md"

- description: "Factual 24: Money-back guarantee window for first-time annual subscriptions"
  vars:
    question: "How many days is the money-back guarantee on first-time annual Plus and Team subscriptions?"
  assert:
    - type: icontains
      value: "30-day money-back guarantee"
    - type: icontains
      value: "docs/refund-policy.md"

- description: "Factual 25: Refund processing time in business days"
  vars:
    question: "How many business days does it take to process an approved refund back to the original payment method?"
  assert:
    - type: icontains
      value: "5 to 10 business days"
    - type: icontains
      value: "docs/refund-policy.md"

